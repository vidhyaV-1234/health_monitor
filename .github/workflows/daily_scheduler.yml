name: Test Scheduler - Every 10 Minutes

on:
  schedule:
    # Run every 10 minutes for testing
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-workflow:
    runs-on: ubuntu-latest
    name: Test Workflow (Every 10 Minutes)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        working-directory: ./health_monitor/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Test Workflow (Morning Tasks)
        working-directory: ./health_monitor/backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
        run: |
          echo "🧪 Running test workflow (every 10 minutes)"
          echo "⏰ Current time: $(date)"
          python run_schedulers.py morning
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs-${{ github.run_id }}
          path: health_monitor/backend/*.log
          retention-days: 7

