name: Daily Scheduler - 7 AM & 7 PM

on:
  schedule:
    # Run at 7 AM UTC (adjust cron time for your timezone)
    # Example: For EST (UTC-5), use '0 12 * * *' for 7 AM EST
    # Example: For PST (UTC-8), use '0 15 * * *' for 7 AM PST
    - cron: '0 7 * * *'  # 7:00 AM UTC
    # Run at 7 PM UTC (adjust cron time for your timezone)
    # Example: For EST (UTC-5), use '0 0 * * *' for 7 PM EST (next day)
    # Example: For PST (UTC-8), use '0 3 * * *' for 7 PM PST (next day)
    - cron: '0 19 * * *'  # 7:00 PM UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  morning-workflow:
    # Run if scheduled for 7 AM UTC or manually triggered
    if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Morning Tasks (7 AM)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        working-directory: ./health_monitor/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Morning Workflow
        working-directory: ./health_monitor/backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
        run: |
          python run_schedulers.py morning
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: morning-logs-${{ github.run_id }}
          path: health_monitor/backend/*.log
          retention-days: 7

  evening-workflow:
    # Run if scheduled for 7 PM UTC or manually triggered
    if: github.event.schedule == '0 19 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Evening Tasks (7 PM)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        working-directory: ./health_monitor/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Evening Workflow
        working-directory: ./health_monitor/backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
        run: |
          python run_schedulers.py evening
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: evening-logs-${{ github.run_id }}
          path: health_monitor/backend/*.log
          retention-days: 7
